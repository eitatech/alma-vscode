# Reversa — Configuração do Projeto
# Este arquivo é gerenciado pelo instalador. Para customizações, edite config.user.toml

[project]
name = "gatomia-vscode"
version = "1.0.0"

[user]
name = "Italo"
chat_language = "en-us"
doc_language = "English"

[output]
folder = "_reversa_sdd"

[agents]
installed = [
  "reversa",
  "reversa-scout",
  "reversa-archaeologist",
  "reversa-detective",
  "reversa-architect",
  "reversa-writer",
  "reversa-reviewer",
  "reversa-visor",
  "reversa-data-master",
  "reversa-design-system",
  "reversa-agents-help",
  "reversa-reconstructor",
  "reversa-migrate",
  "reversa-paradigm-advisor",
  "reversa-curator",
  "reversa-strategist",
  "reversa-designer",
  "reversa-inspector",
  "reversa-requirements",
  "reversa-doubt",
  "reversa-plan",
  "reversa-to-do",
  "reversa-audit",
  "reversa-quality",
  "reversa-coding",
  "reversa-principles",
  "reversa-resume",
  "reversa-pricing-profile",
  "reversa-pricing-size",
  "reversa-pricing-estimate"
]

[engines]
installed = [
  "claude-code",
  "codex",
  "cursor",
  "gemini-cli",
  "windsurf",
  "antigravity",
  "kiro",
  "opencode",
  "github-copilot",
  "amazon-q"
]

[analysis]
answer_mode = "chat"
doc_level = "completo"

# Organização das specs geradas pelos agentes.
# Esta seção é preenchida pelo Reversa após o Scout sugerir uma estrutura
# e o usuário confirmar a escolha no menu (logo após a pergunta de doc_level).
# Para reapresentar o menu, remova a seção [specs] inteira e rode o Reversa de novo.
[specs]
layout = "feature-folder"  # constante "feature-folder" após a primeira execução
granularity = "hybrid"  # module | use-case | endpoint | hybrid | feature | custom
custom_folders = []  # preenchido apenas quando granularity == "custom"
scout_suggestion = "hybrid"  # registro da sugestão original do Scout, imutável após a 1a execução
decided_at = "2026-05-12T12:05:25Z"  # timestamp ISO 8601 da escolha do usuário
